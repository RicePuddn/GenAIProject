[project]
name = "support-ops"
version = "0.1.0"
description = "Policy-bound multi-agent customer support operations (IS469 group project)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.40",    # OpenAI-compatible client: works with Groq, OpenRouter, vLLM, Ollama
    "langgraph>=0.2,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rag = [               
    "sentence-transformers>=5.3",   # native Nomic model support
    "transformers>=5.5,<6",
    "einops>=0.7",                 # Nomic embedding model
    "pypdf>=4.0",                   # PDF policy documents (Topic 8 Lab B)
    "pinecone>=10.2,<11",          # cosine and full-text BM25 through the Documents API
    "nbformat>=5.10",              # evaluation notebook
    "ipykernel>=6.29",
    "pandas>=2.2",                 # evaluation tables
    "ranx>=0.3,<0.4",               # retrieval evaluation metrics
]
demo = ["streamlit>=1.50"]   # scripts/demo_app.py, a chat page that shows each agent step

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]   # ".": test modules share helpers via `from tests.… import …`
