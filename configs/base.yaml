# Every value held constant across the setups (EXPERIMENT.md). A setup ID such as s3-c adds the
# setup's agents, control style, policy mode and strategies from setups.yaml. Code reads every key
# without a default, so a missing key is an error instead of silently giving a different setup.
# Every run writes its fully resolved config next to its results.

run:
  setup: s1-a # the setup and variant when a caller names none (API, demo, scripts)
  seed: 469 # data generation, ticket sampling and trial order
  k_trials: 4 # repeated trials per case, used for pass^k
  trial: 0 # set per trial: part of the LLM cache key, so trials never replay each other
  clock_start: "2026-10-01T09:00:00+08:00" # the workflow date for every run; the API can override it

llm:
  provider: ollama
  base_url: http://localhost:11434/v1
  api_key_env: null
  temperature: 0.0
  max_tokens: 4096
  max_tokens_by_role:
    guard: 512
  reasoning_effort_by_role:
    guard: none
    agent: none
    supervisor: none
    specialist: none
    approver: none
    reply_writer: none
  # Off for experiment runs: with the cache on, repeat trials replay the first one, and cached calls
  # take no time and cost nothing. Set a folder (e.g. results/cache) only while developing.
  cache_dir: null
  cache_enabled_by_role:
    guard: false # always classify live
  models: # one local Ollama model for every role
    agent: lfm3:latest
    supervisor: lfm3:latest
    specialist: lfm3:latest
    approver: lfm3:latest
    reply_writer: lfm3:latest
    guard: lfm3:latest
  pricing: {} # local inference has no provider token price

guard:
  enabled: true
  threshold: 0.5 # malicious-class score at or above which a turn is flagged

policy: # policy.mode (rag or skills) comes from the setup
  rules_file: data/policy/rules.json # the one rules engine's hard limits
  skills_dir: data/policy/skills
  corpus_dir: data/policy/pdf # fixed policy corpus; PDF only
  rag: # organisation selection; the notebook compares the three approaches
    dense: true # Nomic embeddings, cosine
    bm25: true # keyword search; with dense, fused by reciprocal rank fusion
    rrf_k: 60
    n_prime: 20 # candidates passed to the reranker
    rerank: true # cross-encoder rerank
    contextual: true # prepend the section name before indexing
    k: 4 # ranked clauses; direct references are added afterwards
    expand_references: true # also include directly referenced sections
    embedding_model: nomic-ai/nomic-embed-text-v1.5
    rerank_model: BAAI/bge-reranker-v2-m3

review: # the write review and the reply check
  max_rejections: 1 # rejected writes the agent may fix; the next rejection goes to a human
  max_reply_drafts: 2 # reply drafts the reply check sees before the hold reply and a human handoff
  max_wording_rewrites:
    2 # drafts code rejects for wording (a paid claim, an internal ID), redrafted
    # without counting as reply drafts

limits: # per ticket, shared by every agent in it
  max_tool_calls: 40 # data tool executions, writes included
  max_agent_steps: 30 # LLM calls by the agent, supervisor or specialists.
  max_cost_usd: 0.05 # checked before each LLM call; one call can still go over
  max_replans: 2 # plan_execute: corrections after an invalid plan or a failed call
  max_plan_checks: 3 # plan_execute: checks for a missing step after a plan has run in full

retries: # one retry policy for every setup
  tool_errors: 1 # re-runs of a tool that failed for a reason the model can't fix (e.g. a DB timeout)
  invalid_json: 1 # extra tries after a malformed JSON reply
  backoff_s: 0.5 # wait before a tool re-run, times the attempt number

human_cost_per_ticket_usd: 4.00 # baseline for the "acceptable cost" goal; cite your source in the report
