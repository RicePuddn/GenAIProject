# Base configuration shared by every arm (S1-S4). Experiment files override keys from here.
# Every run writes its fully resolved config next to its results.

run:
  seed: 469                 # data generation, ticket sampling and trial order
  k_trials: 4               # repeated trials per case, used for pass^k
  clock_start: "2026-10-01T09:00:00+08:00"   # injectable clock origin

llm:
  provider: groq
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  temperature: 0.0
  reasoning_effort: medium  # gpt-oss only; recorded so both supervisor variants match
  max_tokens_by_role:
    guard: 512              # Prompt Guard's Groq limit
  cache_enabled_by_role:
    guard: false             # Always classify live; do not replay stale/empty results
  cache_dir: results/cache  # response cache for final runs (set to null to disable)
  models:                   # one model family for the main comparison
    supervisor: openai/gpt-oss-120b
    guard: meta-llama/llama-prompt-guard-2-86m
    specialist: openai/gpt-oss-120b
    approver: openai/gpt-oss-120b
    user_simulator: openai/gpt-oss-20b
  # USD per 1M tokens; check provider pricing page and record the date you checked
  pricing:
    openai/gpt-oss-120b: {input: 0.15, output: 0.60}
    openai/gpt-oss-20b: {input: 0.075, output: 0.30}

guard:
  enabled: true
  threshold: 0.5             # numeric malicious-class score threshold

agent:
  strategy: react           # react | plan_and_execute

policy:
  mode: rag              # skills | rag
  rules_file: src/support_ops/policy/rules/rules.json   # shared hard limits
  skills_dir: policy/skills
  corpus_dir: policy/raw_policy/pdf  # fixed policy corpus; PDF only
  rag:                      # organisation selection; notebook compares the three approaches
    dense: true             # Nomic embeddings, cosine
    bm25: true              # keyword search; with dense, fused by reciprocal rank fusion
    rrf_k: 60
    n_prime: 20             # candidates passed to the reranker
    rerank: true            # cross-encoder rerank
    contextual: true        # prepend the section name before indexing
    k: 4                    # ranked clauses; direct references are added afterwards
    expand_references: true # also include directly referenced sections
    embedding_model: nomic-ai/nomic-embed-text-v1.5
    rerank_model: BAAI/bge-reranker-v2-m3

limits:                     # enforced by the workflow between calls
  max_steps_per_ticket: 40  # maximum tool executions
  max_agent_steps: 12
  max_cost_usd_per_ticket: 0.05  # stop before the next call once reached
  max_replans: 2            # plan-and-execute only

human_cost_per_ticket_usd: 4.00   # baseline for the "acceptable cost" goal; cite your source in the report
