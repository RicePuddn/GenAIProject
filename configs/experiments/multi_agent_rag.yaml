extends: base.yaml
# S3: multi-agent (supervisor, specialists, approver, gateway) with rag policy retrieval.
# Two settings, each react or plan_and_execute: agent.strategy for the specialists and
# multi_agent.orchestration for the supervisor (null: same as agent.strategy). Both can be
# overridden per request.

system: multi_agent
policy:
  mode: rag
review:
  trigger: agent               # design supervisor (S3/S4): specialists ask for a write's review themselves;
                               # the fixed workflow (S7/S8) has its own decide step and ignores it
multi_agent:
  design: supervisor            # supervisor (S3/S4): the agents choose their steps; workflow (S7/S8): fixed steps
  orchestration: null           # react: pick each part after seeing the last; plan_and_execute: plan all parts first
  check_citations: true        # a proposal may cite only clauses or files its policy tool returned
  max_orchestration_steps: 4   # supervisor decisions per ticket (delegations + finish)
  max_supervisor_steps: 12     # design supervisor: tool calls per ticket (refused ones too) before it is handed off
  policy_sections:              # each specialist's policy search scope: section names in the corpus
    orders_shipping: [Orders and shipping]
    returns_refunds: [Returns and refunds]
  retries:
    tool_errors: 1             # re-runs of a tool that failed for a reason the model can't fix (e.g. DB timeout)
    invalid_json: 1            # extra tries after a malformed JSON reply from the supervisor or the approver
    backoff_s: 0.5             # wait before a tool re-run, times the attempt number
