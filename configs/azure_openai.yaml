# SUPPORT_OPS_CONFIG=configs/azure_openai.yaml after adding the variables in .env.example.
llm:
  provider: azure_openai
  api_key_env: AZURE_OPENAI_APIM_API_KEY
  azure_endpoint_env: AZURE_OPENAI_APIM_ENDPOINT
  api_version_env: AZURE_OPENAI_CHAT_API_VERSION
  apim_header_env: AZURE_OPENAI_APIM_API_KEY
  # The report names logical models; Azure expects the deployment name behind each alias.
  deployment_envs:
    gpt5.2: GPT52_DEPLOYMENT_NAME
    gpt5: GPT5_DEPLOYMENT_NAME
    gpt5-mini: GPT5_MINI_DEPLOYMENT_NAME
    gpt4o-mini: GPT4Omini_DEPLOYMENT_NAME
  deployment_defaults:
    gpt4o-mini: nprd-gai-gpt-4o-mini
  completion_token_models:
    - gpt5.2
    - gpt5
    - gpt5-mini
  temperature: 0.0
  temperature_by_model:
    gpt5.2: null
    gpt5: null
    gpt5-mini: null
    gpt4o-mini: 0.0
  reasoning_effort_by_model:
    gpt5.2: low
    gpt5: minimal
    gpt5-mini: minimal
  # Sequential tool execution is the runtime's contract; GPT-5 minimal reasoning does not allow
  # parallel tool calls in Azure Chat Completions.
  no_parallel_tools_models:
    - gpt5
    - gpt5-mini
  models:
    agent: gpt5
    supervisor: gpt5
    specialist: gpt5
    approver: gpt5
    reply_writer: gpt5
    guard: gpt5
