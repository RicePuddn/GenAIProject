services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_ops
      POSTGRES_USER: support_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_ops_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - support_ops_postgres:/var/lib/postgresql/data
      - ./data/backend_seed/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_ops -d support_ops"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  support_ops_postgres:
